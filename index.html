<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Interactive VR</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/aframe-event-set-component@5.0.0/dist/aframe-event-set-component.min.js"></script>
  </head>
  <body>
    <a-scene>
      <!-- Assets -->
      <a-assets>
        <img id="sky" src="assets/images/my-360.png" crossorigin="anonymous">
        <audio id="ding" src="assets/sounds/ding.mp3" crossorigin="anonymous"></audio>
        <audio id="ambient" src="assets/sounds/ambience.mp3" preload="auto" crossorigin="anonymous"></audio>
      </a-assets>

      <!-- 360 Sky -->
      <a-sky src="#sky" rotation="0 -90 0"></a-sky>

      <!-- Camera rig with centered gaze cursor -->
      <a-entity id="rig">
        <a-entity camera look-controls position="0 1.6 0">
          <a-entity 
            cursor="fuse: true; fuseTimeout: 1500"
            raycaster="objects: .clickable"
            position="0 0 -1"
            geometry="primitive: ring; radiusInner: 0.02; radiusOuter: 0.03"
            material="color: white; shader: flat">
          </a-entity>
        </a-entity>
      </a-entity>

      <!-- Ambient room music -->
      <a-entity sound="src: #ambient; autoplay: true; loop: true; positional: false; volume: 0.5"></a-entity>

      <!-- Interactive Orbs (gaze only) -->
      <a-entity id="orb1" class="clickable"
                geometry="primitive: sphere; radius: 0.3"
                position="-2 1.5 -3"
                material="color: #FF69B4"
                sound="on: mouseenter; src: #ding"
                event-set__enter="_event: mouseenter; scale: 1.5 1.5 1.5; material.color: yellow"
                event-set__leave="_event: mouseleave; scale: 1 1 1; material.color: #FF69B4">
        <a-animation begin="mouseenter" attribute="position" to="-2 3 -3" dur="1500" fill="forwards" easing="ease-out"></a-animation>
      </a-entity>

      <a-entity id="orb2" class="clickable"
                geometry="primitive: sphere; radius: 0.3"
                position="2 1.2 -2"
                material="color: #00CED1"
                sound="on: mouseenter; src: #ding"
                event-set__enter="_event: mouseenter; scale: 1.5 1.5 1.5; material.color: lime"
                event-set__leave="_event: mouseleave; scale: 1 1 1; material.color: #00CED1">
        <a-animation begin="mouseenter" attribute="position" to="2 2.5 -2" dur="1500" fill="forwards" easing="ease-out"></a-animation>
      </a-entity>

      <a-entity id="orb3" class="clickable"
                geometry="primitive: sphere; radius: 0.3"
                position="0 1 -3"
                material="color: #9370DB"
                sound="on: mouseenter; src: #ding"
                event-set__enter="_event: mouseenter; scale: 1.4 1.4 1.4; material.color: white"
                event-set__leave="_event: mouseleave; scale: 1 1 1; material.color: #9370DB">
        <a-animation begin="mouseenter" attribute="position" to="0 2 -3" dur="1200" fill="forwards" easing="ease-out"></a-animation>
      </a-entity>

      <a-entity id="orb4" class="clickable"
                geometry="primitive: sphere; radius: 0.3"
                position="-1.5 0.8 -2.5"
                material="color: #00FFAA"
                sound="on: mouseenter; src: #ding"
                event-set__enter="_event: mouseenter; scale: 1.6 1.6 1.6; material.color: orange"
                event-set__leave="_event: mouseleave; scale: 1 1 1; material.color: #00FFAA">
        <a-animation begin="mouseenter" attribute="position" to="-1.5 2 -2.5" dur="1800" fill="forwards" easing="ease-out"></a-animation>
      </a-entity>

      <a-entity id="orb5" class="clickable"
                geometry="primitive: sphere; radius: 0.3"
                position="1.5 0.8 -2.8"
                material="color: #FF8C00"
                sound="on: mouseenter; src: #ding"
                event-set__enter="_event: mouseenter; scale: 1.3 1.3 1.3; material.color: cyan"
                event-set__leave="_event: mouseleave; scale: 1 1 1; material.color: #FF8C00">
        <a-animation begin="mouseenter" attribute="position" to="1.5 1.8 -2.8" dur="1000" fill="forwards" easing="ease-out"></a-animation>
      </a-entity>

    </a-scene>
  </body>
</html>
